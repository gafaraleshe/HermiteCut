# HermiteCut's Rust crates (crates/, docs/RUST_PLAN.md): cargo fmt, clippy
# and the tests on Windows, macOS and Linux.
name: Rust

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'hosts/resolve/bridge.lua'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: A zip from another tool, for the zip reader
        shell: bash
        run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('interop.zip','w'); z.writestr('Pack/Grade.cube','LUT_3D_SIZE 33\n'*400, compress_type=zipfile.ZIP_DEFLATED); z.writestr('Pack/Hit.wav', b'RIFF'+bytes(64)); z.close()" \
            || python -c "import zipfile; z=zipfile.ZipFile('interop.zip','w'); z.writestr('Pack/Grade.cube','LUT_3D_SIZE 33\n'*400, compress_type=zipfile.ZIP_DEFLATED); z.writestr('Pack/Hit.wav', b'RIFF'+bytes(64)); z.close()"
          echo "HC_TEST_ZIP=${{ github.workspace }}/interop.zip" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
