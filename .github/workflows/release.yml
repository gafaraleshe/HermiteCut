# Publishes a GitHub Release of HermiteCut.
#
# Runs on every push to main. If the version in app/package.json has no
# release yet, it builds everything (build.yml) and publishes v<version> with
# notes from that version's section of CHANGELOG.md. If that release already
# exists, it stops after one quick check. So: bump the version and add a
# CHANGELOG section, merge to main, and the release appears.
#
# Running it from the Actions tab (Release > Run workflow), or pushing a tag
# v*, always builds and replaces the files on that version's release.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('app/package.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building and publishing v$VERSION."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: HermiteCut-*
          path: out
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python3 - "$VERSION" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(v) + r'\][^\n]*\n(.*?)(?=^## \[|^\[)', text, re.S | re.M)
          print(m.group(1).strip() if m else f'HermiteCut {v}')
          PY
          find out -type f | sort
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          FILES=$(find out -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.drfx' \) | sort)
          test -n "$FILES"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "HermiteCut $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
