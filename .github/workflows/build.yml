# Builds HermiteCut for Windows and macOS.
#
# Runs on every push to a branch other than main (release.yml builds main),
# and from the Actions tab (Build > Run workflow). Each run keeps its builds
# for 30 days: open the run and download them under "Artifacts".
#   HermiteCut-Windows          HermiteCut-Windows-Setup.exe   the app (NSIS, per user)
#   HermiteCut-Mac              HermiteCut-Mac-arm64.dmg / -x64.dmg, ad-hoc signed
#   HermiteCut-Panel-and-Pack   the panel-only Windows zip and HermiteCut.drfx
# release.yml calls this workflow and publishes the same files.
name: Build

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Check sources
        run: |
          for f in app/*.js hosts/resolve/*.js core/lib/*.js core/ui/js/*.js; do node --check "$f"; done
          test -z "$(gofmt -l installer)"
      - name: Build the pack, sounds, panel and app project
        run: |
          pip install numpy==2.1.3
          python scripts/assemble.py
      - name: Build the panel-only Windows installer
        run: scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: assembled
          path: build/app
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Panel-and-Pack
          path: |
            dist/*.zip
            build/HermiteCut.drfx
          retention-days: 30
          if-no-files-found: error

  windows:
    needs: assemble
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assembled
          path: build/app
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the Windows installer
        working-directory: build/app
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Windows
          path: build/app/dist/HermiteCut-Windows-Setup.exe
          retention-days: 30
          if-no-files-found: error

  mac:
    needs: assemble
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assembled
          path: build/app
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the macOS disk images (Apple Silicon and Intel)
        working-directory: build/app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Mac
          path: build/app/dist/*.dmg
          retention-days: 30
          if-no-files-found: error
