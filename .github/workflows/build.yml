# Builds HermiteCut for Windows and macOS.
#
# Runs on every push to a branch other than main (release.yml builds main),
# and from the Actions tab (Build > Run workflow). Each run keeps its builds
# for 30 days: open the run and download them under "Artifacts".
#   HermiteCut-Windows          HermiteCut-Windows-Setup.exe   the app (NSIS, per user)
#   HermiteCut-Mac              HermiteCut-Mac-arm64.dmg / -x64.dmg, ad-hoc signed
#   HermiteCut-Windows-Panel    the panel-only Windows zip (Rust installer)
#   HermiteCut-Pack             HermiteCut.drfx, the template pack on its own
# release.yml calls this workflow and publishes the same files.
name: Build

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/rust.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Check sources
        run: |
          for f in app/*.js hosts/resolve/*.js core/lib/*.js core/ui/js/*.js; do node --check "$f"; done
      - name: Build the pack, sounds, panel and app project
        # Licensing: set these as repository variables (Settings > Secrets and
        # variables > Actions > Variables). Without POLAR_ORGANIZATION_ID the
        # build needs no licence key.
        env:
          HC_POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
          HC_POLAR_CHECKOUT_URL: ${{ vars.POLAR_CHECKOUT_URL }}
          HC_POLAR_PORTAL_URL: ${{ vars.POLAR_PORTAL_URL }}
          HC_PRICE: ${{ vars.HERMITECUT_PRICE }}
        run: |
          pip install numpy==2.1.3
          python scripts/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: assembled
          path: |
            build/app
            build/plugin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Pack
          path: build/HermiteCut.drfx
          retention-days: 30
          if-no-files-found: error

  windows:
    needs: assemble
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assembled
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Build the Rust engine and put it in the app and panel
        run: |
          bun scripts/build-native.ts --release
          bun scripts/place-native.ts
      - name: Build the Windows installer
        working-directory: build/app
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Windows
          path: build/app/dist/HermiteCut-Windows-Setup.exe
          retention-days: 30
          if-no-files-found: error
      - name: Build the panel-only installer and zip (Rust)
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Windows-Panel
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error

  mac:
    needs: assemble
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assembled
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Build the Rust engine (Apple Silicon and Intel) and put it in the app and panel
        run: |
          rustup target add x86_64-apple-darwin
          bun scripts/build-native.ts --release
          bun scripts/build-native.ts --release --target x86_64-apple-darwin
          bun scripts/place-native.ts
      - name: Build the macOS disk images (Apple Silicon and Intel)
        working-directory: build/app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HermiteCut-Mac
          path: build/app/dist/*.dmg
          retention-days: 30
          if-no-files-found: error
